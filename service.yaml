apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: rag-digestats
  labels:
    managed-by: github-actions
    cloud.googleapis.com/location: europe-west1
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      labels:
        managed-by: github-actions
        run.googleapis.com/startupProbeType: Default
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 2
      timeoutSeconds: 600
      serviceAccountName: agentic-rag-runtime@rag-digestats.iam.gserviceaccount.com
      containers:
      - image: europe-west1-docker.pkg.dev/rag-digestats/rag-repo/rag-app:latest
        ports:
        - name: http1
          containerPort: 8080
        env:
        - name: QDRANT_URL
          valueFrom:
            secretKeyRef:
              key: latest
              name: qdrant-url
        - name: QDRANT_API_KEY
          valueFrom:
            secretKeyRef:
              key: latest
              name: qdrant-api-key
        - name: GOOGLE_API_KEY
          valueFrom:
            secretKeyRef:
              key: latest
              name: google-api-key
        - name: TAVILY_API_KEY
          valueFrom:
            secretKeyRef:
              key: latest
              name: tavily-api-key
        - name: APP_PASSWORD
          valueFrom:
            secretKeyRef:
              key: latest
              name: app-password
        - name: LANGFUSE_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              key: latest
              name: langfuse-public-key
        - name: LANGFUSE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              key: latest
              name: langfuse-secret-key
        - name: LANGFUSE_HOST
          value: https://cloud.langfuse.com
        - name: PYTHONUNBUFFERED
          value: "1"
        # Corpus v2 (build_chunks.py, 27/11/2026). Retour arrière : remettre
        # reglementation_digestats (toujours présente dans Qdrant).
        - name: QDRANT_COLLECTION
          value: reglementation_digestats_v2
        # Threads torch = CPU alloués (limits.cpu). Avec 4 threads pour 2 CPU,
        # l'attente active OpenMP faisait brider le conteneur : 23 s pour
        # encoder une requête, 86 s pour reranker 10 extraits (27/11/2026).
        - name: OMP_NUM_THREADS
          value: "2"
        # Reranker léger (118M) : bge-reranker-v2-m3 (568M) prenait ~78 s pour
        # 10 paires sur 2 CPU. Éval 27/11 : NF U 10/13 pour les deux, recall
        # identique, context_precision -0,07. Retour : BAAI/bge-reranker-v2-m3.
        - name: RERANKER_MODEL
          value: cross-encoder/mmarco-mMiniLMv2-L12-H384-v1
        resources:
          limits:
            cpu: "2"
            memory: 8Gi
        startupProbe:
          # Budget ~3 min (cold start 30-60s avec image ~1 GB), détection
          # d'un échec en ~30s. Avant : 240s x 3 = jusqu'à 12 min aveugle,
          # hérité de l'ère des cold starts de 2-5 min.
          timeoutSeconds: 5
          periodSeconds: 10
          failureThreshold: 18
          tcpSocket:
            port: 8080
  traffic:
  - percent: 100
    latestRevision: true